services:
  # Full insurance service (AgentCore primary)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x402-insurance-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      # App Configuration
      - ENV=production
      - DEBUG=false
      - PORT=8080
      - HOST=0.0.0.0

      # Database (use PostgreSQL in Docker)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-x402user}:${POSTGRES_PASSWORD:-x402pass}@postgres:5432/x402insurance

      # Rate limiting (use Redis)
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_STORAGE_URL=redis://redis:6379/0

    volumes:
      # Mount data directory for persistence
      - ./data:/app/data
      # Mount Jolt Atlas binary
      - ./jolt-atlas:/app/jolt-atlas
      # Mount logs directory
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - x402-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Huey background worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x402-insurance-worker
    restart: unless-stopped
    command: huey_consumer tasks.huey_config.huey -w 2 -k thread
    env_file: .env
    environment:
      - ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql://${POSTGRES_USER:-x402user}:${POSTGRES_PASSWORD:-x402pass}@postgres:5432/x402insurance
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./jolt-atlas:/app/jolt-atlas
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - x402-network

  # Read-only public dashboard (lightweight, no blockchain deps)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: x402-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DASHBOARD_ONLY=true
      - PORT=8000
      - CORS_ORIGINS=*
    networks:
      - x402-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: x402-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=x402insurance
      - POSTGRES_USER=${POSTGRES_USER:-x402user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-x402pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - x402-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-x402user} -d x402insurance"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for distributed rate limiting
  redis:
    image: redis:7-alpine
    container_name: x402-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - x402-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: x402-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@x402insurance.local
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - x402-network
    profiles:
      - tools  # Only start with: docker-compose --profile tools up

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  pgadmin-data:
    driver: local

networks:
  x402-network:
    driver: bridge
