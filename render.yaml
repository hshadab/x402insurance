services:
  # Dashboard-only service (read-only, no wallet/blockchain deps)
  - type: web
    name: x402-insurance-dashboard
    runtime: python
    region: oregon
    plan: starter

    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 30 dashboard_server:app

    healthCheckPath: /health
    autoDeploy: true
    branch: main

    envVars:
      - key: ENV
        value: production
      - key: FLASK_ENV
        value: production
      - key: AGENTCORE_SERVICE_URL
        value: https://4axkjkepdx.us-east-1.awsapprunner.com
